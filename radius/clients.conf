# Jatelo Connect — RADIUS clients.
# Every router reaches RADIUS only through its WireGuard tunnel (10.88.0.0/16).
# WireGuard authenticates each router's key, so one shared secret per subnet is safe;
# the tunnel source address then identifies the router (nas table) and tenant.

client wireguard_routers {
	ipaddr = 10.88.0.0/16
	secret = $ENV{RADIUS_SECRET}
	require_message_authenticator = no
	nas_type = other
	shortname = jc-routers
	limit {
		max_connections = 16
		lifetime = 0
		idle_timeout = 30
	}
}

# Local health checks from the API container
client localhost {
	ipaddr = 127.0.0.1
	secret = $ENV{RADIUS_SECRET}
	shortname = localhost
}

client docker_net {
	ipaddr = 172.16.0.0/12
	secret = $ENV{RADIUS_SECRET}
	shortname = docker
}

# Non-MikroTik devices (Ruijie, Omada, UniFi…) send RADIUS over the internet from a
# fixed public IP. Unknown sources are looked up in the nas table on first packet;
# anything not registered there is ignored.
client dynamic_public {
	ipaddr = 0.0.0.0/0
	dynamic_clients = dynamic_clients
	lifetime = 600
}
